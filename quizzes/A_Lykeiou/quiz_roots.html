<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GMATH — Quiz Ρίζες Πραγματικών Αριθμών</title>
    
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        .quiz-container { max-width: 700px; margin: 120px auto 60px; padding: 0 20px; }
        .quiz-card { background: white; border-radius: 24px; padding: 40px; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.1); text-align: center; position: relative; overflow: hidden; }
        .quiz-progress { position: absolute; top: 0; left: 0; height: 6px; background: var(--brand-purple); transition: width 0.4s ease; }
        .question-meta { color: var(--text-muted); font-size: 14px; font-weight: 600; margin-bottom: 20px; display: block; }
        .question-text { font-size: 22px; font-family: 'Playfair Display', serif; color: var(--text-ink); margin-bottom: 40px; min-height: 80px; display: flex; align-items: center; justify-content: center; line-height: 1.5; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .quiz-option-btn { padding: 20px; border-radius: 16px; border: 2px solid #f1f5f9; background: white; font-size: 18px; font-weight: 700; color: var(--text-ink); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .quiz-option-btn:hover { border-color: var(--brand-purple-light); background: #f5f3ff; transform: translateY(-2px); }
        .quiz-option-btn.correct { background: #ecfdf5; border-color: #10b981; color: #065f46; }
        .quiz-option-btn.wrong { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
        .quiz-option-btn i { font-size: 24px; }
        .feedback-area { min-height: 60px; margin-top: 20px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; border-radius: 12px; transition: all 0.3s; padding: 10px; line-height: 1.4; }
        .feedback-area.correct { color: #10b981; background: #ecfdf5; border: 1px solid #10b981; }
        .feedback-area.wrong { color: #ef4444; background: #fef2f2; border: 1px solid #ef4444; }
        .next-quiz-btn { margin-top: 20px; padding: 15px 40px; background: var(--brand-purple); color: white; border: none; border-radius: 50px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); display: none; }
        .next-quiz-btn:hover { background: var(--brand-purple-dark); transform: scale(1.05); }
        .result-screen { display: none; }
        .result-score { font-size: 64px; font-weight: 900; color: var(--brand-purple); margin: 20px 0; font-family: 'Playfair Display', serif; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; font-weight: 600; margin-bottom: 20px; transition: 0.3s; }
        .back-btn:hover { color: var(--brand-purple); }
        @media (max-width: 640px) { .quiz-options { grid-template-columns: 1fr; } .quiz-card { padding: 30px 20px; } .question-text { font-size: 18px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container flex justify-between items-center h-full">
            <a href="../../index.html" class="logo italic">GMATH</a>
            <div class="nav-links">
                <a href="../../index.html">Αρχική</a>
                <a href="../../math.html" class="active">Μαθηματικά</a>
                <a href="../../aepp.html">ΑΕΠΠ</a>
                <a href="../../links.html">Σύνδεσμοι</a>
            </div>
        </div>
    </nav>

    <div class="quiz-container">
        <a href="../../math.html" class="back-btn"><i class="fas fa-arrow-left"></i> Επιστροφή στις Σημειώσεις</a>
        
        <div class="quiz-card" id="quiz-card">
            <div class="quiz-progress" id="progress-bar" style="width: 0%"></div>
            
            <div id="question-screen">
                <span class="question-meta">Ερώτηση <span id="current-idx">1</span> από <span id="total-questions">5</span></span>
                <div class="question-text" id="question-text">Φορτώνεται ερώτηση...</div>
                
                <div class="quiz-options">
                    <button onclick="checkAnswer(true)" class="quiz-option-btn" id="btn-true"><i class="fas fa-check-circle"></i><span>Σωστό</span></button>
                    <button onclick="checkAnswer(false)" class="quiz-option-btn" id="btn-false"><i class="fas fa-times-circle"></i><span>Λάθος</span></button>
                </div>

                <div id="feedback" class="feedback-area" style="display: none;"></div>
                <button id="next-btn" onclick="nextQuestion()" class="next-quiz-btn">Επόμενη Ερώτηση <i class="fas fa-arrow-right ml-2"></i></button>
            </div>

            <div class="result-screen" id="result-screen">
                <i class="fas fa-trophy text-6xl text-yellow-500 mb-6" style="font-size: 60px; color: #f59e0b;"></i>
                <h2 class="class-header" style="border: none; padding: 0;">Συγχαρητήρια!</h2>
                <p class="text-muted mt-4">Ολοκληρώσατε το Quiz: Ρίζες Πραγματικών Αριθμών</p>
                <div class="result-score"><span id="score-val">0</span>/<span id="result-total">5</span></div>
                <button onclick="location.reload()" class="next-quiz-btn" style="display: inline-block;">Προσπάθεια Ξανά</button>
                <div class="mt-8">
                    <a href="../../math.html" class="contact-link" style="color: var(--brand-purple);">Επιστροφή στα Μαθηματικά</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container text-center"><p>&copy; 2026 GMATH. Μεράκι για τα μαθηματικά.</p></div>
    </footer>

    <script>
        const questions = [
            { 
                text: "Η πρόταση \\( \\sqrt{x^2} = x \\) είναι σωστή;", 
                correct: false, 
                explanation: "Το σωστό είναι \\( \\sqrt{x^2} = |x| \\). Ισούται με \\( x \\) μόνο αν \\( x \\ge 0 \\)." 
            },
            { 
                text: "Η παράσταση \\( \\sqrt{-α} \\) δεν έχει ποτέ νόημα.", 
                correct: false, 
                explanation: "Αν το \\( α \\) είναι αρνητικό ή μηδέν (π.χ. \\( α = -4 \\)), τότε \\( -α = 4 > 0 \\) και η ρίζα ορίζεται κανονικά." 
            },
            { 
                text: "Η πρόταση \\( \\sqrt[3]{x^6} = x^2 \\) είναι σωστή;", 
                correct: true, 
                explanation: "Ισχύει \\( \\sqrt[3]{x^6} = x^{\\frac{6}{3}} = x^2 \\). Επειδή η τάξη της ρίζας (3) είναι περιττή, δεν χρειαζόμαστε απόλυτο." 
            },
            { 
                text: "Αν \\( α < 0 \\) και \\( β > 0 \\), τότε ισχύει: \\( \\sqrt[3]{-α^3 \\cdot β} = -α \\cdot \\sqrt[3]{β} \\)", 
                correct: true, 
                explanation: "Επειδή η ρίζα είναι περιττής τάξης, ισχύει \\( \\sqrt[3]{-α^3} = -α \\) (ή \\( |α| \\) αφού \\( α < 0 \\)). Οπότε βγαίνει εκτός ρίζας ως \\( -α \\)." 
            },
            { 
                text: "Αν \\( α \\ge 0 \\) και \\( β \\neq 0 \\), τότε ισχύει: \\( \\frac{\\sqrt{α β^2}}{β} = \\sqrt{α} \\).", 
                correct: false, 
                explanation: "\\( \\sqrt{α β^2} = \\sqrt{α} \\cdot |β| \\). Αν το \\( β \\) είναι αρνητικό, το κλάσμα γίνεται \\( \\frac{-β}{β} \\sqrt{α} = -\\sqrt{α} \\)." 
            }
        ];

        let currentQuestion = 0; 
        let score = 0; 
        let answered = false;

        const correctSound = new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3');
        const wrongSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');
        correctSound.volume = 0.4; 
        wrongSound.volume = 0.3;

        function loadQuestion() {
            answered = false; 
            document.getElementById("feedback").style.display = "none"; 
            document.getElementById("feedback").textContent = ""; 
            document.getElementById("feedback").className = "feedback-area";
            document.getElementById("next-btn").style.display = "none"; 
            document.getElementById("current-idx").textContent = currentQuestion + 1;
            document.getElementById("total-questions").textContent = questions.length; 
            document.getElementById("question-text").innerHTML = questions[currentQuestion].text;
            
            const btns = document.querySelectorAll('.quiz-option-btn'); 
            btns.forEach(btn => { 
                btn.className = 'quiz-option-btn'; 
                btn.disabled = false; 
            });
            
            const prog = ((currentQuestion) / questions.length) * 100; 
            document.getElementById("progress-bar").style.width = prog + "%";
            
            if (window.MathJax) { 
                MathJax.typesetPromise(); 
            }
        }

        function checkAnswer(userAnswer) {
            if (answered) return; 
            answered = true; 
            const correct = questions[currentQuestion].correct === userAnswer;
            const feedbackEl = document.getElementById("feedback"); 
            const nextBtn = document.getElementById("next-btn");
            const btns = document.querySelectorAll('.quiz-option-btn'); 
            btns.forEach(btn => btn.disabled = true);

            feedbackEl.style.display = "flex";

            if (correct) {
                score++; 
                correctSound.play().catch(e => console.log("Audio play failed:", e));
                feedbackEl.innerHTML = "✅ Σωστά! <br><br>" + (questions[currentQuestion].explanation || ""); 
                feedbackEl.className = "feedback-area correct";
                document.getElementById(userAnswer ? 'btn-true' : 'btn-false').classList.add('correct');
            } else {
                wrongSound.play().catch(e => console.log("Audio play failed:", e));
                feedbackEl.innerHTML = "❌ Λάθος! <br><br>" + (questions[currentQuestion].explanation || ""); 
                feedbackEl.className = "feedback-area wrong";
                document.getElementById(userAnswer ? 'btn-true' : 'btn-false').classList.add('wrong');
                document.getElementById(!userAnswer ? 'btn-true' : 'btn-false').classList.add('correct');
            }
            
            if (window.MathJax) { MathJax.typesetPromise(); }
            
            nextBtn.style.display = "inline-block";
            if (currentQuestion === questions.length - 1) { 
                nextBtn.innerHTML = "Δείτε το Αποτέλεσμα <i class='fas fa-chart-bar ml-2'></i>"; 
            }
        }

        function nextQuestion() {
            currentQuestion++; 
            if (currentQuestion < questions.length) { 
                loadQuestion(); 
            } else { 
                showResult(); 
            }
        }

        function showResult() {
            document.getElementById("question-screen").style.display = "none"; 
            document.getElementById("result-screen").style.display = "block";
            document.getElementById("score-val").textContent = score; 
            document.getElementById("result-total").textContent = questions.length;
            document.getElementById("progress-bar").style.width = "100%";
        }

        window.addEventListener('load', loadQuestion);
    </script>
</body>
</html>
