<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Ολοκληρώματα</title>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
        .quiz-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; border: 1px solid #ddd; }
        .question-card { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 8px; }
        .options { margin-top: 10px; }
        /* Χρησιμοποιούμε μια κλάση για να μην μπερδεύεται το MathJax με τα κουμπιά */
        .option-btn { margin-right: 10px; cursor: pointer; }
        .explanation { display: none; margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>Τεστ Ολοκληρώματα</h2>
    <div id="quiz-form">
        <div class="question-card" id="card1">
            <p><strong>1. α)</strong> Η παράγουσα μιας συνάρτησης f σε ένα διάστημα Δ είναι αριθμός.</p>
            <div class="options">
                <input type="radio" name="q1" value="Σ" id="q1s"><label for="q1s">Σωστό</label>
                <input type="radio" name="q1" value="Λ" id="q1l"><label for="q1l">Λάθος</label>
            </div>
            <div class="explanation" id="exp1">Αιτιολόγηση: Η παράγουσα είναι συνάρτηση, ενώ το ορισμένο ολοκλήρωμα είναι αριθμός.</div>
        </div>
        
        <button onclick="checkAnswers()">Υποβολή</button>
    </div>
</div>

<script>
    function checkAnswers() {
        // Η λογική ελέγχου παραμένει ίδια
        document.querySelectorAll('.explanation').forEach(el => el.style.display = 'block');
    }
</script>

</body>
</html>
