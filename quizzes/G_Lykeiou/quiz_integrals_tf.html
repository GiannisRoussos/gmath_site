<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GMATH — Quiz Ολοκληρώματα Γ' Λυκείου</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        .quiz-container { max-width: 750px; margin: 120px auto 60px; padding: 0 20px; }
        .quiz-card { background: white; border-radius: 24px; padding: 40px; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.1); text-align: center; position: relative; overflow: hidden; }
        .quiz-progress { position: absolute; top: 0; left: 0; height: 6px; background: var(--brand-purple); transition: width 0.4s ease; }
        
        /* Header τεστ & Χρονόμετρο */
        .quiz-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .question-meta { color: var(--text-muted); font-size: 15px; font-weight: 600; }
        .timer-box { font-size: 1.2rem; font-weight: bold; color: #ef4444; background: #fef2f2; padding: 6px 14px; border-radius: 12px; }
        
        .question-text { font-size: 22px; color: var(--text-ink); margin-bottom: 30px; min-height: 80px; display: flex; align-items: center; justify-content: center; line-height: 1.6; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .quiz-option-btn { padding: 15px; border-radius: 16px; border: 2px solid #f1f5f9; background: white; font-size: 18px; font-weight: 700; color: var(--text-ink); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .quiz-option-btn:hover { border-color: var(--brand-purple-light); background: #f5f3ff; transform: translateY(-2px); }
        .quiz-option-btn.correct { background: #ecfdf5; border-color: #10b981; color: #065f46; }
        .quiz-option-btn.wrong { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
        .quiz-option-btn i { font-size: 24px; }
        
        /* Επεξήγηση / Feedback */
        .feedback-area { min-height: 60px; margin-top: 10px; padding: 15px; display: none; align-items: center; justify-content: center; flex-direction: column; font-weight: 600; font-size: 16px; border-radius: 12px; transition: all 0.3s; line-height: 1.5; }
        .feedback-area.correct { display: flex; background: #ecfdf5; border: 1px solid #10b981; color: #065f46; }
        .feedback-area.wrong { display: flex; background: #fef2f2; border: 1px solid #ef4444; color: #991b1b; }
        
        .next-quiz-btn { margin-top: 20px; padding: 15px 40px; background: var(--brand-purple); color: white; border: none; border-radius: 50px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); display: none; margin-left: auto; margin-right: auto; }
        .next-quiz-btn:hover { background: #7c3aed; transform: scale(1.05); }
        .result-screen { display: none; }
        .result-score { font-size: 64px; font-weight: 900; color: var(--brand-purple); margin: 20px 0; font-family: 'Playfair Display', serif; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; font-weight: 600; margin-bottom: 20px; transition: 0.3s; }
        .back-btn:hover { color: var(--brand-purple); }
        @media (max-width: 640px) { .quiz-options { grid-template-columns: 1fr; } .quiz-card { padding: 30px 20px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container flex justify-between items-center h-full">
            <a href="../../index.html" class="logo italic">GMATH</a>
            <div class="nav-links">
                <a href="../../index.html">Αρχική</a>
                <a href="../../math.html" class="active">Μαθηματικά</a>
            </div>
        </div>
    </nav>

    <div class="quiz-container">
        <a href="../../math.html" class="back-btn"><i class="fas fa-arrow-left"></i> Επιστροφή στα Μαθηματικά</a>
        
        <div class="quiz-card" id="quiz-card">
            <div class="quiz-progress" id="progress-bar" style="width: 0%"></div>
            
            <div id="question-screen">
                <div class="quiz-header-bar">
                    <span class="question-meta">Ερώτηση <span id="current-idx">1</span> από <span id="total-questions">7</span></span>
                    <div class="timer-box" id="timer"><i class="fas fa-stopwatch"></i> 15:00</div>
                </div>

                <div class="question-text" id="question-text">Φορτώνεται ερώτηση...</div>
                
                <div class="quiz-options">
                    <button onclick="checkAnswer(true)" class="quiz-option-btn" id="btn-true"><i class="fas fa-check-circle"></i><span>Σωστό</span></button>
                    <button onclick="checkAnswer(false)" class="quiz-option-btn" id="btn-false"><i class="fas fa-times-circle"></i><span>Λάθος</span></button>
                </div>

                <div id="feedback" class="feedback-area"></div>
                <button id="next-btn" onclick="nextQuestion()" class="next-quiz-btn">Επόμενη Ερώτηση <i class="fas fa-arrow-right ml-2"></i></button>
            </div>

            <div class="result-screen" id="result-screen">
                <i class="fas fa-trophy text-yellow-500 mb-6" style="font-size: 60px; color: #f59e0b;"></i>
                <h2 style="font-size: 28px; color: var(--text-ink); margin-bottom: 10px;">Ολοκληρώσατε το Τεστ!</h2>
                <p class="text-muted mt-4">Κεφάλαιο 3: Ολοκληρωτικός Λογισμός</p>
                <div class="result-score"><span id="score-val">0</span>/<span id="result-total">7</span></div>
                <button onclick="location.reload()" class="next-quiz-btn" style="display: inline-block;">Προσπάθεια Ξανά</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container text-center"><p>&copy; 2026 GMATH. Μεράκι για τα μαθηματικά.</p></div>
    </footer>

    <script>
        const questions = [
            { text: "Η παράγουσα μιας συνάρτησης f σε ένα διάστημα Δ είναι αριθμός.", correct: false, explanation: "Η παράγουσα μιας συνάρτησης είναι συνάρτηση (ή οικογένεια συναρτήσεων \\(F(x)+c\\)), ενώ το ορισμένο ολοκλήρωμα είναι αριθμός." },
            { text: "Αν \\( F(x) = f(x) \\) και \\( f(0) = 1 \\), όπου F είναι αρχική της f, τότε υποχρεωτικά \\( f(x) = e^x \\).", correct: true, explanation: "Ισχύει \\( F'(x) = f(x) \\). Αφού \\( F(x) = f(x) \\), έχουμε \\( f'(x) = f(x) \\), άρα \\( f(x) = c \\cdot e^x \\). Με \\( f(0)=1 \\) προκύπτει \\( c=1 \\), άρα \\( f(x) = e^x \\)." },
            { text: "Κάθε συνεχής συνάρτηση f σε ένα διάστημα [α, β] είναι ολοκληρώσιμη στο [α, β].", correct: true, explanation: "Αποτελεί βασικό θεώρημα του ολοκληρωτικού λογισμού." },
            { text: "Αν \\( f(x) \\ge g(x) \\) για κάθε \\( x \\in [\\alpha, \\beta] \\), τότε \\( \\int_{\\alpha}^{\\beta} f(x)dx \\ge \\int_{\\alpha}^{\\beta} g(x)dx \\).", correct: true, explanation: "Προκύπτει από την ιδιότητα ότι αν \\( h(x) = f(x) - g(x) \\ge 0 \\), τότε και \\( \\int_{\\alpha}^{\\beta} h(x)dx \\ge 0 \\)." },
            { text: "\\( \\int_{\\alpha}^{\\beta} \\left( \\int_{\\alpha}^{x} 2du \\right) dx = \\beta^2 - \\alpha^2 \\).", correct: false, explanation: "Το εσωτερικό ολοκλήρωμα είναι \\( 2(x-\\alpha) \\). Το εξωτερικό γίνεται \\( \\int_{\\alpha}^{\\beta} (2x - 2\\alpha)dx = [x^2 - 2\\alpha x]_{\\alpha}^{\\beta} = (\\beta-\\alpha)^2 \\), το οποίο είναι διαφορετικό." },
            { text: "\\( \\int_{\\alpha+\\gamma}^{\\beta+\\gamma} f(x-\\gamma)dx = \\int_{\\alpha}^{\\beta} f(x)dx \\).", correct: true, explanation: "Προκύπτει άμεσα με την αλλαγή μεταβλητής \\( u = x - \\gamma \\)." },
            { text: "Αν F αρχική της f τότε: \\( \\int_{\\alpha}^{\\beta} f(x)dx = F(x) + c \\).", correct: false, explanation: "Σύμφωνα με το Θεμελιώδες Θεώρημα, ισχύει \\( \\int_{\\alpha}^{\\beta} f(x)dx = F(\\beta) - F(\\alpha) \\), που είναι σταθερός αριθμός." }
        ];

        let currentQuestion = 0; let score = 0; let answered = false;

        const correctSound = new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3');
        const wrongSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');
        correctSound.volume = 0.4; wrongSound.volume = 0.3;

        // Χρονόμετρο 15 λεπτά (900 δευτερόλεπτα)
        let timeLeft = 15 * 60; 
        const timerEl = document.getElementById('timer');
        let timerId = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerId);
                timerEl.innerHTML = "<i class='fas fa-exclamation-triangle'></i> 00:00";
                alert("Ο χρόνος έληξε!");
                showResult();
            } else {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                timerEl.innerHTML = "<i class='fas fa-stopwatch'></i> " + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
                timeLeft--;
            }
        }, 1000);

        function loadQuestion() {
            answered = false; 
            document.getElementById("feedback").className = "feedback-area";
            document.getElementById("next-btn").style.display = "none"; 
            document.getElementById("current-idx").textContent = currentQuestion + 1;
            document.getElementById("total-questions").textContent = questions.length; 
            document.getElementById("question-text").innerHTML = questions[currentQuestion].text;
            
            const btns = document.querySelectorAll('.quiz-option-btn'); 
            btns.forEach(btn => { btn.className = 'quiz-option-btn'; btn.disabled = false; });
            
            const prog = ((currentQuestion) / questions.length) * 100; 
            document.getElementById("progress-bar").style.width = prog + "%";
            
            if (window.MathJax) { MathJax.typesetPromise(); }
        }

        function checkAnswer(userAnswer) {
            if (answered) return; 
            answered = true; 
            const correct = questions[currentQuestion].correct === userAnswer;
            const feedbackEl = document.getElementById("feedback"); 
            const nextBtn = document.getElementById("next-btn");
            const btns = document.querySelectorAll('.quiz-option-btn'); 
            btns.forEach(btn => btn.disabled = true);

            let explanationHtml = "<span style='font-size:14px; font-weight:normal; margin-top:5px;'>" + questions[currentQuestion].explanation + "</span>";

            if (correct) {
                score++; correctSound.play().catch(e => console.log("Audio play failed:", e));
                feedbackEl.innerHTML = "✅ Σωστά!<br>" + explanationHtml; 
                feedbackEl.className = "feedback-area correct";
                document.getElementById(userAnswer ? 'btn-true' : 'btn-false').classList.add('correct');
            } else {
                wrongSound.play().catch(e => console.log("Audio play failed:", e));
                feedbackEl.innerHTML = "❌ Λάθος!<br>" + explanationHtml; 
                feedbackEl.className = "feedback-area wrong";
                document.getElementById(userAnswer ? 'btn-true' : 'btn-false').classList.add('wrong');
                document.getElementById(!userAnswer ? 'btn-true' : 'btn-false').classList.add('correct');
            }
            if (window.MathJax) { MathJax.typesetPromise([feedbackEl]); }
            
            nextBtn.style.display = "block";
            if (currentQuestion === questions.length - 1) { nextBtn.innerHTML = "Δείτε το Αποτέλεσμα <i class='fas fa-chart-bar ml-2'></i>"; }
        }

        function nextQuestion() {
            currentQuestion++; 
            if (currentQuestion < questions.length) { loadQuestion(); } else { showResult(); }
        }

        function showResult() {
            clearInterval(timerId); // Σταματάει το χρονόμετρο
            document.getElementById("question-screen").style.display = "none"; 
            document.getElementById("result-screen").style.display = "block";
            document.getElementById("score-val").textContent = score; 
            document.getElementById("result-total").textContent = questions.length;
            document.getElementById("progress-bar").style.width = "100%";
        }

        window.addEventListener('load', loadQuestion);
    </script>
</body>
</html>
